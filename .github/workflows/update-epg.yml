name: Update The Mid West Plainsman TV EPG

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    paths:
      - "generate_epg.py"
      - ".github/workflows/update-epg.yml"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-epg:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate EPG
        run: python generate_epg.py
      - name: Validate generated files\n        run: |\n          test -s "The-Mid-West-Plainsman-TV.xml"\n          test -s "epg.json"\n          python - <<'PY'\n          import json\n          import xml.etree.ElementTree as ET\n          from datetime import datetime, timedelta, timezone\n\n          expected = "TheMidWestPlainsman"\n          expected_programmes = 7 * 24\n\n          with open("epg.json", encoding="utf-8") as f:\n              data = json.load(f)\n\n          if len(data) != expected_programmes:\n              raise SystemExit(f"Expected {expected_programmes} JSON programmes, got {len(data)}.")\n          if {item.get("channel_id") for item in data} != {expected}:\n              raise SystemExit("EPG JSON contains unexpected channels.")\n\n          root = ET.parse("The-Mid-West-Plainsman-TV.xml").getroot()\n          if root.tag != "tv":\n              raise SystemExit("EPG XML root is not <tv>.")\n          if root.find("channel[@id='" + expected + "']") is None:\n              raise SystemExit("EPG XML channel is missing.")\n\n          programmes = root.findall("programme")\n          if len(programmes) != expected_programmes:\n              raise SystemExit(f"Expected {expected_programmes} XML programmes, got {len(programmes)}.")\n\n          def parse_xmltv(value):\n              stamp, offset = value.strip().rsplit(" ", 1)\n              sign = 1 if offset[0] == "+" else -1\n              minutes = int(offset[1:3]) * 60 + int(offset[3:5])\n              tz = timezone(sign * timedelta(minutes=minutes))\n              return datetime.strptime(stamp, "%Y%m%d%H%M%S").replace(tzinfo=tz)\n\n          previous_end = None\n          for index, programme in enumerate(programmes, 1):\n              start_time = parse_xmltv(programme.attrib["start"]).astimezone(timezone.utc)\n              stop_time = parse_xmltv(programme.attrib["stop"]).astimezone(timezone.utc)\n              if stop_time - start_time != timedelta(hours=1):\n                  raise SystemExit(f"Programme {index} is not exactly one hour.")\n              if previous_end is not None and start_time != previous_end:\n                  raise SystemExit(f"Gap or overlap before programme {index}.")\n              previous_end = stop_time\n\n          print(f"Validation successful: {len(programmes)} hourly programmes; 1 channel.")\n          PY\n      - name: Check for changes
        id: changes
        run: |
          if [ -z "$(git status --porcelain -- "The-Mid-West-Plainsman-TV.xml" "epg.json")" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Commit updated EPG
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "The-Mid-West-Plainsman-TV.xml" "epg.json"
          git commit -m "Update The Mid West Plainsman TV EPG"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
      - name: No EPG changes
        if: steps.changes.outputs.changed == 'false'
        run: echo "No EPG changes detected."
