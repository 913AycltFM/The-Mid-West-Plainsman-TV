name: Update The Mid West Plainsman TV EPG

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    paths:
      - "generate_epg.py"
      - ".github/workflows/update-epg.yml"
      - "The-Mid-West-Plainsman-TV.m3u"

permissions:
  contents: write

concurrency:
  group: update-mid-west-plainsman-epg-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-epg:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate and validate IPTV files
        run: python generate_epg.py

      - name: Commit updated XMLTV guide
        run: |
          git add "The-Mid-West-Plainsman-TV-Guide.xml" "epg.json"

          if git diff --cached --quiet; then
            echo "No XMLTV changes detected."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update The Mid West Plainsman TV EPG"

          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
