name: Update The Mid West Plainsman TV

on:
  schedule:
    # Refresh the seven-day IPTV guide every five minutes.
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "generate_epg.py"
      - ".github/workflows/update-epg.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Verify Python environment
        run: python --version

      - name: Show run information
        run: |
          echo "Event: ${{ github.event_name }}"
          echo "Scheduled expression: ${{ github.event.schedule }}"
          date -u

      - name: Verify Central Time daylight-saving transitions
        run: |
          python - <<'PY'
          from datetime import datetime
          from zoneinfo import ZoneInfo
          from generate_epg import xmltv_datetime

          central = ZoneInfo("America/Chicago")
          checks = [
              (datetime(2026, 3, 8, 1, 59, tzinfo=central), "20260308015900 -0600"),
              (datetime(2026, 3, 8, 3, 0, tzinfo=central), "20260308030000 -0500"),
              (datetime(2026, 11, 1, 1, 0, tzinfo=central, fold=0), "20261101010000 -0500"),
              (datetime(2026, 11, 1, 1, 0, tzinfo=central, fold=1), "20261101010000 -0600"),
          ]
          for value, expected in checks:
              actual = xmltv_datetime(value)
              if actual != expected:
                  raise SystemExit(f"DST check failed: {actual} != {expected}")
          print("Central Time daylight-saving checks passed (CDT/CST).")
          PY

      - name: Generate and validate IPTV feeds and Pages files
        run: python generate_epg.py

      - name: Check generated files
        run: |
          test -s "The-Mid-West-Plainsman-TV-Guide.xml"
          test -s "epg.json"
          test -s "_site/The-Mid-West-Plainsman-TV.m3u"
          test -s "_site/The-Mid-West-Plainsman-TV-Guide.xml"
          test -s "_site/epg.json"
          test -s "_site/assets/the-mid-west-plainsman-logo.jpg"
          test -s "_site/assets/the-mid-west-plainsman-background.png"
          ls -lh "The-Mid-West-Plainsman-TV-Guide.xml" "epg.json" _site _site/assets

      - name: Check for generated changes
        id: changes
        run: |
          git status --short
          if git diff --quiet -- "The-Mid-West-Plainsman-TV-Guide.xml" "epg.json"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit updated IPTV guide
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "The-Mid-West-Plainsman-TV-Guide.xml" "epg.json"
          git commit -m "Update The Mid West Plainsman IPTV EPG"

          for attempt in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then
              echo "Rebase conflict detected; keeping the EPG generated by this run."
              git checkout --theirs -- "The-Mid-West-Plainsman-TV-Guide.xml" "epg.json"
              git add "The-Mid-West-Plainsman-TV-Guide.xml" "epg.json"
              GIT_EDITOR=true git rebase --continue
            fi
            if git push origin HEAD:main; then
              echo "EPG push succeeded on attempt $attempt."
              exit 0
            fi
            echo "Push attempt $attempt failed because main moved. Retrying..."
            git rebase --abort 2>/dev/null || true
          done
          echo "Unable to push EPG after 3 attempts."
          exit 1

      - name: No EPG changes
        if: steps.changes.outputs.changed == 'false'
        run: echo "No EPG changes detected."

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
