name: Update The Mid West Plainsman TV Guide

on:
  schedule:
    # Refresh the seven-day IPTV guide every five minutes.
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "generate_epg.py"
      - ".github/workflows/update-epg.yml"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-epg:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Verify Python environment
        run: python --version

      - name: Show run information
        run: |
          echo "Event: ${{ github.event_name }}"
          echo "Scheduled expression: ${{ github.event.schedule }}"
          date -u

      - name: Verify Central Time daylight-saving transitions
        run: |
          python - <<'PY'
          from datetime import datetime
          from zoneinfo import ZoneInfo
          from generate_epg import xmltv_datetime

          central = ZoneInfo("America/Chicago")
          checks = [
              (datetime(2026, 3, 8, 1, 59, tzinfo=central), "20260308015900 -0600"),
              (datetime(2026, 3, 8, 3, 0, tzinfo=central), "20260308030000 -0500"),
              (datetime(2026, 11, 1, 1, 0, tzinfo=central, fold=0), "20261101010000 -0500"),
              (datetime(2026, 11, 1, 1, 0, tzinfo=central, fold=1), "20261101010000 -0600"),
          ]
          for value, expected in checks:
              actual = xmltv_datetime(value)
              if actual != expected:
                  raise SystemExit(f"DST check failed: {actual} != {expected}")
          print("Central Time daylight-saving checks passed (CDT/CST).")
          PY

      - name: Generate IPTV EPG
        run: python generate_epg.py

      - name: Check generated files
        run: |
          test -f "The-Mid-West-Plainsman-TV-Guide.xml"
          test -f "epg.json"
          ls -lh "The-Mid-West-Plainsman-TV-Guide.xml" "epg.json"

      - name: Validate XML, JSON, channel, and programme coverage
        run: |
          python - <<'PY'
          import json
          import xml.etree.ElementTree as ET

          channel_id = "TheMidWestPlainsman"
          expected_programmes = 168

          xml_file = "The-Mid-West-Plainsman-TV-Guide.xml"
          json_file = "epg.json"
          playlist_file = "The-Mid-West-Plainsman-TV.m3u"

          root = ET.parse(xml_file).getroot()
          if root.tag != "tv":
              raise SystemExit("XMLTV root element must be <tv>.")

          xml_channels = root.findall("channel")
          if len(xml_channels) != 1 or xml_channels[0].get("id") != channel_id:
              raise SystemExit("XMLTV must contain exactly The Mid West Plainsman channel.")

          xml_programmes = root.findall("programme")
          if len(xml_programmes) != expected_programmes:
              raise SystemExit(
                  f"Expected {expected_programmes} XMLTV programmes; "
                  f"found {len(xml_programmes)}."
              )
          if any(item.get("channel") != channel_id for item in xml_programmes):
              raise SystemExit("XMLTV contains a programme assigned to an unexpected channel.")

          with open(json_file, encoding="utf-8") as file:
              data = json.load(file)

          if data.get("timezone") != "America/Chicago":
              raise SystemExit("JSON EPG timezone must be America/Chicago.")

          channel = data.get("channel", {})
          if channel.get("id") != channel_id or channel.get("number") != "1":
              raise SystemExit("JSON EPG channel metadata is incorrect.")

          programmes = data.get("programmes")
          if not isinstance(programmes, list) or len(programmes) != expected_programmes:
              raise SystemExit(
                  f"Expected {expected_programmes} JSON programmes; "
                  f"found {len(programmes) if isinstance(programmes, list) else 'invalid data'}."
              )
          if any(item.get("channel_id") != channel_id for item in programmes):
              raise SystemExit("JSON contains a programme assigned to an unexpected channel.")

          with open(playlist_file, encoding="utf-8-sig") as file:
              lines = [line.strip() for line in file if line.strip()]

          if not lines or lines[0] != "#EXTM3U":
              raise SystemExit("IPTV playlist must begin with #EXTM3U.")

          entries = [line for line in lines if line.startswith("#EXTINF:")]
          if len(entries) != 1 or f'tvg-id="{channel_id}"' not in entries[0]:
              raise SystemExit("M3U must contain exactly the expected Plainsman channel.")

          print(
              f"Validation successful: 1 channel, {len(xml_programmes)} XMLTV "
              f"programmes, {len(programmes)} JSON programmes, "
              "America/Chicago timezone, and one M3U channel."
          )
          PY

      - name: Check for generated changes
        id: changes
        run: |
          git status --short
          if git diff --quiet -- "The-Mid-West-Plainsman-TV-Guide.xml" "epg.json"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit updated IPTV guide
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "The-Mid-West-Plainsman-TV-Guide.xml" "epg.json"
          git commit -m "Update The Mid West Plainsman IPTV EPG"

          for attempt in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then
              echo "Rebase conflict detected; keeping the EPG generated by this run."
              git checkout --theirs -- "The-Mid-West-Plainsman-TV-Guide.xml" "epg.json"
              git add "The-Mid-West-Plainsman-TV-Guide.xml" "epg.json"
              GIT_EDITOR=true git rebase --continue
            fi
            if git push origin HEAD:main; then
              echo "EPG push succeeded on attempt $attempt."
              exit 0
            fi
            echo "Push attempt $attempt failed because main moved. Retrying..."
            git rebase --abort 2>/dev/null || true
          done
          echo "Unable to push EPG after 3 attempts."
          exit 1

      - name: No EPG changes
        if: steps.changes.outputs.changed == 'false'
        run: echo "No EPG changes detected."
