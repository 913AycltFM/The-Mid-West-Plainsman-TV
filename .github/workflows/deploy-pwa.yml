name: Deploy The Mid West Plainsman TV App

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "manifest.json"
      - "service-worker.js"
      - "icons/**"
      - ".github/workflows/deploy-pwa.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Prepare site
        run: |
          mkdir -p _site
          cp index.html manifest.json service-worker.js _site/
          cp -R icons _site/icons
          cp epg.json The-Mid-West-Plainsman-TV.m3u The-Mid-West-Plainsman-TV-Guide.xml _site/
          touch _site/.nojekyll
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4